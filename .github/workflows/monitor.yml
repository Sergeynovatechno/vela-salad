name: Vela Pool Monitor

on:
  schedule:
    - cron: '0,30 * * * *' # Запуск каждые 30 минут (в 00 и 30 минут каждого часа)
  workflow_dispatch: # Позволяет запустить вручную кнопкой

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Разрешение на сохранение файла history.json
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python monitor.py

      - name: Commit history
        run: |
          git config --global user.name 'Vela Bot'
          git config --global user.email 'bot@vela.local'
          git add history.json
          git commit -m "Update history [skip ci]" || exit 0
          git push
