name: Vela Pool Monitor

on:
  schedule:
    - cron: '*/30 * * * *' # Каждые 30 минут
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python monitor.py

      - name: Commit history
        run: |
          git config --global user.name 'Vela Bot'
          git config --global user.email 'bot@vela.local'
          git add history.json
          # Коммитим, даже если нет изменений, чтобы GitHub видел активность
          git commit -m "Update history [skip ci]" --allow-empty 
          git push
